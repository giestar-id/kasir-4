services:
  - type: web
    name: pos-kuliner
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "POS Kuliner"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

