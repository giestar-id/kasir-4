# fly.toml app configuration file for kasir-4

app = 'kasir-4'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_NAME = 'POS Kuliner'
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://kasir-4.fly.dev'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/var/www/html/database/database.sqlite'
  SESSION_DRIVER = 'cookie'
  SESSION_LIFETIME = '10080'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'sync'
  MCP_ENABLED = 'true'
  MCP_BASE_URL = 'https://kasir-4.fly.dev/mcp/pos'
  MCP_API_KEY = 'pos_sec_b6v7yfJm8BVhIwOXASL3SeiCGqhpXEVf'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

